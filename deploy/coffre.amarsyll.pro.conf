# ============================================================================
#  VirtualHost Apache — Coffre Familial (coffre.amarsyll.pro)
#  SPA React (client/dist) + reverse proxy /api vers l'API Node (127.0.0.1:4200)
#  Fichier : /etc/apache2/sites-available/coffre.amarsyll.pro.conf
#  Modules : sudo a2enmod proxy proxy_http rewrite headers ssl
# ============================================================================

<VirtualHost *:80>
    ServerName coffre.amarsyll.pro
    DocumentRoot /var/www/coffre/client/dist
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName coffre.amarsyll.pro
    DocumentRoot /var/www/coffre/client/dist

    # --- SSL (certbot remplira ces lignes) ---
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/coffre.amarsyll.pro/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/coffre.amarsyll.pro/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # --- En-têtes de sécurité ---
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # --- Reverse proxy vers l'API Node (Express écoute sur 127.0.0.1:4200) ---
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        /api  http://127.0.0.1:4200/api
    ProxyPassReverse /api  http://127.0.0.1:4200/api
    ProxyTimeout 300

    # --- SPA React : les routes inconnues renvoient index.html ---
    <Directory /var/www/coffre/client/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        RewriteEngine On
        RewriteBase /
        # Ne pas réécrire les appels API
        RewriteCond %{REQUEST_URI} !^/api/
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_URI} !^/api/
        RewriteRule . /index.html [L]

        # Cache des assets versionnés (Vite), pas de cache pour index.html
        <FilesMatch "\.(js|css|woff2?|png|jpe?g|webp|svg|ico)$">
            Header set Cache-Control "public, max-age=31536000, immutable"
        </FilesMatch>
        <FilesMatch "index\.html$">
            Header set Cache-Control "no-cache, no-store, must-revalidate"
        </FilesMatch>
    </Directory>

    # --- Compression ---
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml
    </IfModule>

    ErrorLog  ${APACHE_LOG_DIR}/coffre.amarsyll.pro-error.log
    CustomLog ${APACHE_LOG_DIR}/coffre.amarsyll.pro-access.log combined
</VirtualHost>

# IMPORTANT : le dossier de stockage des fichiers chiffrés (STORAGE_DIR, ex.
# /var/lib/coffre/uploads) doit rester HORS de la racine web. Ne jamais le
# placer sous /var/www/coffre. Les fichiers y sont chiffrés (AES-256-GCM) et
# ne transitent que déchiffrés à la volée via l'API, pour un membre autorisé.
